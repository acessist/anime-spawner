name: Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml, README.md]
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        shell: pwsh
        run: |
          ./build.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          New-Item -ItemType Directory -Force work/test-classes | Out-Null
          javac -encoding UTF-8 -cp work/classes -d work/test-classes tests/animespawner/*.java
          if ($LASTEXITCODE -ne 0) { throw 'Test compilation failed' }
          java -cp 'work/classes;work/test-classes' animespawner.Tests work/tests
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Package Windows application
        shell: pwsh
        run: |
          ./package.ps1
          Copy-Item README.md 'work/packages/Anime Spawner/README.md'
          Compress-Archive -LiteralPath 'work/packages/Anime Spawner' -DestinationPath AnimeSpawner-1.1.0-Windows-x64.zip
          $hash = (Get-FileHash AnimeSpawner-1.1.0-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  AnimeSpawner-1.1.0-Windows-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
          [IO.File]::WriteAllText("release-notes.md", "")
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release view v1.1.0 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.1.0 AnimeSpawner-1.1.0-Windows-x64.zip SHA256SUMS.txt --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
            gh release edit v1.1.0 --notes-file release-notes.md
          } else {
            gh release create v1.1.0 AnimeSpawner-1.1.0-Windows-x64.zip SHA256SUMS.txt --target $env:RELEASE_COMMIT --title 'Anime Spawner 1.1.0' --notes-file release-notes.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Verify published README
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download v1.1.0 --pattern AnimeSpawner-1.1.0-Windows-x64.zip --dir work/verify
          if ($LASTEXITCODE -ne 0) { throw 'Download verification failed' }
          Expand-Archive work/verify/AnimeSpawner-1.1.0-Windows-x64.zip work/verify/extracted
          $expected = (Get-FileHash README.md -Algorithm SHA256).Hash
          $actual = (Get-FileHash 'work/verify/extracted/Anime Spawner/README.md' -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw 'Published README differs from repository README' }
          Write-Output "Published README matches repository: $actual"
