name: Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        shell: pwsh
        run: |
          ./build.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          New-Item -ItemType Directory -Force work/test-classes | Out-Null
          javac -encoding UTF-8 -cp work/classes -d work/test-classes tests/animespawner/*.java
          if ($LASTEXITCODE -ne 0) { throw 'Test compilation failed' }
          java -cp 'work/classes;work/test-classes' animespawner.Tests work/tests
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Package Windows application
        shell: pwsh
        run: |
          ./package.ps1
          Copy-Item README.md 'work/packages/Anime Spawner/README.md'
          Compress-Archive -LiteralPath 'work/packages/Anime Spawner' -DestinationPath AnimeSpawner-1.1.0-Windows-x64.zip
          $hash = (Get-FileHash AnimeSpawner-1.1.0-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  AnimeSpawner-1.1.0-Windows-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
          @'
          ## Anime Spawner 1.1.0
          Download **AnimeSpawner-1.1.0-Windows-x64.zip** below, extract it, and open **Anime Spawner.exe**.
          Keep the app and runtime folders beside the executable. Java is included.
          
          - Empty library: import your own GIF, APNG or image.
          - Delete unwanted imports without deleting the original files.
          - Transparent desktop animations, resizing, mirroring and saved scenes.
          
          Requires Windows 10/11 x64. This portable build does not use an installer.
          The source-code archives are for developers; use the Windows ZIP to run the app.
          '@ | Set-Content release-notes.md -Encoding utf8
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release view v1.1.0 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release v1.1.0 already exists; refusing to replace it.' }
          gh release create v1.1.0 AnimeSpawner-1.1.0-Windows-x64.zip SHA256SUMS.txt --target $env:RELEASE_COMMIT --title 'Anime Spawner 1.1.0' --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
